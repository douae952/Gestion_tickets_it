<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Espace Employé</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="dashboard">

    <header>

        <img src="{{ url_for('static', filename='yazaki.png') }}"
             alt="Yazaki"
             class="logo-yazaki">

        <h1>Espace Employé</h1>

        <p>Bienvenue {{ session.get("username") }}</p>

    </header>


    <div class="cards">

        <!-- Nouveau ticket -->
        <a href="{{ url_for('ajouter') }}" class="card">

            <div class="icon">📝</div>

            <h2>Nouveau ticket</h2>

            <p>
                Signaler un nouveau problème informatique
            </p>

        </a>


        <!-- Mes tickets -->
        <a href="{{ url_for('mes_tickets') }}" class="card">

            <div class="icon">📋</div>

            <h2>Mes tickets</h2>

            <p>
                Consulter mes tickets et leur statut
            </p>

        </a>


        <!-- Suivre un ticket -->
        <a href="{{ url_for('rechercher') }}" class="card">

            <div class="icon">🔎</div>

            <h2>Suivre un ticket</h2>

            <p>
                Rechercher un ticket par son ID
            </p>

        </a>


        <!-- Déconnexion -->
        <a href="{{ url_for('logout') }}" class="card">

            <div class="icon">🚪</div>

            <h2>Déconnexion</h2>

            <p>
                Quitter l'espace employé
            </p>

        </a>

    </div>

</div>

</body>
</html>
