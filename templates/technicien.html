<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Espace Technicien IT</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="dashboard">

        <header>

            <img
                src="{{ url_for('static', filename='yazaki.png') }}"
                alt="Logo Yazaki"
                class="logo-yazaki"
            >

            <h1>Espace Technicien IT</h1>

            <p>Gestion et traitement des tickets</p>

        </header>


        <div class="cards">

            <a href="/tickets" class="card">

                <div class="icon">📋</div>

                <h2>Tickets</h2>

                <p>
                    Consulter les tickets des employés
                </p>

            </a>


            <a href="/rechercher" class="card">

                <div class="icon">🔎</div>

                <h2>Rechercher</h2>

                <p>
                    Rechercher un ticket par ID
                </p>

            </a>


            <a href="/modifier" class="card">

                <div class="icon">✏️</div>

                <h2>Traiter un ticket</h2>

                <p>
                    Ajouter une solution et modifier le statut
                </p>

            </a>


            <a href="/statistiques" class="card">

                <div class="icon">📊</div>

                <h2>Statistiques</h2>

                <p>
                    Analyser les tickets IT
                </p>

            </a>

        </div>


        <div style="text-align: center; margin-top: 30px;">

            <a href="/logout">

                <button>
                    🚪 Déconnexion
                </button>

            </a>

        </div>

    </div>

</body>

</html>
