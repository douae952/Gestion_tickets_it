<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ajouter un ticket</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="form-container">

    <!-- Logo Yazaki -->
    <img src="{{ url_for('static', filename='yazaki.png') }}"
         alt="Yazaki"
         class="logo-yazaki-small">

    <h1 class="page-title">Ajouter un ticket</h1>

    <form method="POST">

        <!-- Département -->
        <label for="departement">Département</label>

        <input type="text"
               id="departement"
               name="departement"
               placeholder="Exemple : Production"
               required>


        <!-- Catégorie -->
        <label for="categorie">Catégorie</label>

        <input type="text"
               id="categorie"
               name="categorie"
               placeholder="Exemple : Réseau"
               required>


        <!-- Description -->
        <label for="description">Description du problème</label>

        <textarea id="description"
                  name="description"
                  placeholder="Décrivez le problème rencontré..."
                  required></textarea>


        <!-- Technicien / Solution / Statut -->
        <!-- Ces champs sont visibles seulement pour Admin et Technicien -->

        {% if session.get("role") != "employe" %}

            <label for="technicien">Technicien IT</label>

            <input type="text"
                   id="technicien"
                   name="technicien"
                   placeholder="Nom du technicien">


            <label for="solution">Solution</label>

            <textarea id="solution"
                      name="solution"
                      placeholder="Solution apportée..."></textarea>


            <label for="statut">Statut</label>

            <select id="statut" name="statut">

                <option value="En attente">
                    En attente
                </option>

                <option value="En cours">
                    En cours
                </option>

                <option value="Résolu">
                    Résolu
                </option>

                <option value="Fermé">
                    Fermé
                </option>

            </select>

        {% endif %}


        <!-- Bouton Ajouter -->
        <button type="submit">
            Ajouter le ticket
        </button>

    </form>


    <!-- Bouton Retour -->
    <a href="{{ url_for('accueil') }}"
       class="btn-retour">
        ← Retour
    </a>

</div>

</body>

</html>
