<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un ticket</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="form-container">

    <img src="{{ url_for('static', filename='yazaki.png') }}"
         alt="Yazaki"
         class="logo-yazaki-small">

    <h1 class="page-title">Ajouter un ticket</h1>

    <form method="POST">

        <label for="departement">Département</label>
        <input type="text"
               id="departement"
               name="departement"
               required>

        <label for="categorie">Catégorie</label>
        <input type="text"
               id="categorie"
               name="categorie"
               required>

        <label for="description">Description du problème</label>
        <textarea id="description"
                  name="description"
                  required></textarea>

        {% if session.get("role") != "employe" %}

            <label for="technicien">Technicien IT</label>
            <input type="text"
                   id="technicien"
                   name="technicien">

            <label for="solution">Solution</label>
            <textarea id="solution"
                      name="solution"></textarea>

            <label for="statut">Statut</label>
            <select id="statut" name="statut">
                <option value="En attente">En attente</option>
                <option value="En cours">En cours</option>
                <option value="Résolu">Résolu</option>
                <option value="Fermé">Fermé</option>
            </select>

        {% endif %}

        <button type="submit">Ajouter le ticket</button>

    </form>

    <br>

    <a href="{{ url_for('accueil') }}" class="card">
        Retour
    </a>

</div>

</body>
</html>
