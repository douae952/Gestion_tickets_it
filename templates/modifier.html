<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Modifier un ticket</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="form-container">

        <img
            src="{{ url_for('static', filename='yazaki.png') }}"
            alt="Logo Yazaki"
            class="logo-yazaki-small"
        >

        <h1>Modifier un ticket</h1>

        <form method="POST">

            <label>ID du ticket</label>

            <input
                type="text"
                name="id"
                required
            >

            <label>Technicien IT</label>

            <input
                type="text"
                name="technicien"
                required
            >

            <label>Solution</label>

            <textarea
                name="solution"
                required
            ></textarea>

            <label>Statut</label>

            <input
                type="text"
                name="statut"
                required
            >

            <button type="submit">
                Modifier le ticket
            </button>

        </form>

        {% if message %}

        <p class="message">
            {{ message }}
        </p>

        {% endif %}

        <a href="/">
            <button>Retour</button>
        </a>

    </div>

</body>

</html>
