<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Gestion des Tickets IT - Yazaki Kenitra</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="dashboard">

        <header>

            <img
                src="{{ url_for('static', filename='yazaki.png') }}"
                alt="Logo Yazaki"
                class="logo-yazaki"
            >

            <h1>Gestion des Tickets IT</h1>

            <p>Yazaki Kenitra</p>

        </header>


        <div class="cards">

            <a href="/ajouter" class="card">
                <div class="icon">➕</div>
                <h2>Ajouter</h2>
                <p>Créer un nouveau ticket IT</p>
            </a>


            <a href="/tickets" class="card">
                <div class="icon">📋</div>
                <h2>Tickets</h2>
                <p>Afficher tous les tickets</p>
            </a>


            <a href="/rechercher" class="card">
                <div class="icon">🔎</div>
                <h2>Rechercher</h2>
                <p>Rechercher un ticket par ID</p>
            </a>


            <a href="/modifier" class="card">
                <div class="icon">✏️</div>
                <h2>Modifier</h2>
                <p>Modifier les informations d'un ticket</p>
            </a>


            <a href="/supprimer" class="card">
                <div class="icon">🗑️</div>
                <h2>Supprimer</h2>
                <p>Supprimer un ticket</p>
            </a>


            <a href="/statistiques" class="card">
                <div class="icon">📊</div>
                <h2>Statistiques</h2>
                <p>Analyser les tickets IT</p>
            </a>

        </div>

    </div>

</body>

</html>
